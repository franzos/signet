[package]
name = "signet-issuer"
description = "Signet's offline CLI: generate signing keys and issue/verify license blobs."
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "signet-issuer"
path = "src/main.rs"

[dependencies]
signetlib = { path = "../signetlib" }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
clap = { version = "4", features = ["derive"] }
ed25519-dalek = { version = "2" }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
