[package]
name = "signetlib"
description = "Signet's library: license claims, Ed25519 signing, and the offline-verifiable wire format."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
base64 = "0.22"
ciborium = "0.2"
ed25519-dalek = { version = "2" }
hex = "0.4"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
thiserror = "2"
