<!DOCTYPE html>
<html lang="en" data-theme="{{ chrome.theme }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}License Shop{% endblock %}</title>
    <link rel="stylesheet" href="/static/styles.css">
    {% if let Some(a) = chrome.analytics %}
      <script {% if a.module %}type="module" {% endif %}
              {% if let Some(e) = a.entity %}data-entity="{{ e }}" {% endif %}
              src="{{ a.src }}"></script>
    {% endif %}
  </head>
  <body>
    <header class="appbar">
      <div role="radiogroup"
           aria-label="Theme"
           class="theme-toggle"
           data-theme-toggle>
        <button type="button"
                role="radio"
                data-theme-value="system"
                title="System"
                aria-label="System theme"
                aria-checked="{% if chrome.theme == "system" %}true{% else %}false{% endif %}"
                tabindex="{% if chrome.theme == "system" %}0{% else %}-1{% endif %}">
          <svg viewBox="0 0 24 24"
               fill="none"
               stroke="currentColor"
               stroke-width="2"
               stroke-linecap="round"
               stroke-linejoin="round"
               aria-hidden="true">
            <rect x="2" y="4" width="20" height="14" rx="2" />
            <path d="M8 21h8M12 18v3" />
          </svg>
        </button>
        <button type="button"
                role="radio"
                data-theme-value="light"
                title="Light"
                aria-label="Light theme"
                aria-checked="{% if chrome.theme == "light" %}true{% else %}false{% endif %}"
                tabindex="{% if chrome.theme == "light" %}0{% else %}-1{% endif %}">
          <svg viewBox="0 0 24 24"
               fill="none"
               stroke="currentColor"
               stroke-width="2"
               stroke-linecap="round"
               stroke-linejoin="round"
               aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
          </svg>
        </button>
        <button type="button"
                role="radio"
                data-theme-value="dark"
                title="Dark"
                aria-label="Dark theme"
                aria-checked="{% if chrome.theme == "dark" %}true{% else %}false{% endif %}"
                tabindex="{% if chrome.theme == "dark" %}0{% else %}-1{% endif %}">
          <svg viewBox="0 0 24 24"
               fill="none"
               stroke="currentColor"
               stroke-width="2"
               stroke-linecap="round"
               stroke-linejoin="round"
               aria-hidden="true">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
          </svg>
        </button>
      </div>
    </header>
    <main class="wrap">
      {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
      {% if !chrome.links.is_empty() %}
        <nav class="footer-links">
          {% for l in chrome.links %}<a href="{{ l.href }}">{{ l.title }}</a>{% endfor %}
        </nav>
      {% endif %}
      {% if let Some(notice) = chrome.notice %}<p class="footer-notice">{{ notice }}</p>{% endif %}
    </footer>
    <script src="/static/theme.js" defer></script>
  </body>
</html>
