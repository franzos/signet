[package]
name = "signet-shop"
description = "Signet's single-binary web shop: sell licenses via Stripe Checkout and issue them offline."
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "signet-shop"
path = "src/main.rs"

[dependencies]
signetlib = { path = "../signetlib" }
anyhow = "1"
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time"] }
tower-http = { version = "0.6", features = ["set-header"] }
tower_governor = { version = "0.8", default-features = false, features = ["axum"] }
askama = "0.16"
include_dir = "0.7"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
ed25519-dalek = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Email on purchase: polymail's `config` schema (ProviderConfig), with SMTP
# (self-hosted) and Lettermint (HTTP) compiled in, both rustls.
polymail = { version = "0.1.6", default-features = false, features = ["config", "smtp", "lettermint-reqwest-013"] }

stripe-edge = { git = "https://git.gofranz.com/franz/stripe-edge", tag = "v0.1.2" }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
stripe-edge = { git = "https://git.gofranz.com/franz/stripe-edge", tag = "v0.1.2", features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
