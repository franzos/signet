# cargo-deny config. CI runs `cargo deny check advisories` against Cargo.lock
# (RustSec advisory DB) as a non-blocking signal, see .github/workflows/ci.yml.
# Add advisory IDs to `ignore` with a one-line rationale to silence a known,
# accepted finding.
[advisories]
version = 2
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"
ignore = [
    # rsa (Marvin timing sidechannel on RSA decryption) reaches the lockfile
    # only through sqlx-mysql, which is NOT compiled: signet-shop uses sqlx with
    # the sqlite feature only. No private-key RSA decryption happens here, so the
    # key-recovery attack doesn't apply, and no fixed rsa release exists yet.
    "RUSTSEC-2023-0071",
]
