name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      # No `cargo fmt --check` gate: the tree follows a compact hand style, not
      # default rustfmt. Add one once a one-time `cargo fmt` pass has landed.
      - name: Check
        run: cargo check --workspace --locked

      - name: Clippy
        run: cargo clippy --workspace --locked -- -D warnings

      # Unit + doc tests. The one Stripe-backed test self-gates: without
      # STRIPE_API_KEY / STRIPE_SECRET_KEY it prints a skip and passes, so no
      # secret is needed in CI.
      - name: Test
        run: cargo test --workspace --locked

  audit:
    name: cargo-deny advisories
    runs-on: ubuntu-latest
    # Warn, don't block: advisories surface as PR annotations + in the log, but
    # an unfixed transitive CVE never stalls an unrelated PR. The GitHub Security
    # tab / Dependabot drive remediation. Flip this off to make CVEs gate merges.
    continue-on-error: true
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2
        with:
          command: check advisories
