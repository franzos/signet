name: audit

on:
  schedule:
    # Weekly, Monday morning UTC. Unlike the push-time CI job (which warns but
    # never blocks a PR), this run fails on a new RustSec advisory against the
    # pinned deps, so the failure notification is the alert.
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: cargo-deny advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2
        with:
          command: check advisories
