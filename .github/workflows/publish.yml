name: Publish to crates.io

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Run tests
        run: cargo test --workspace --locked

      # Publishes only signetlib: signet-issuer and signet-shop are marked
      # `publish = false`, so they ship as release binaries and the Docker
      # image, not as crates. The action skips versions already on crates.io,
      # so re-running a release is safe. Needs a CARGO_REGISTRY_TOKEN secret.
      - name: Publish to crates.io
        uses: katyo/publish-crates@02cc2f1ad653fb25c7d1ff9eb590a8a50d06186b # v2
        with:
          registry-token: ${{ secrets.CARGO_REGISTRY_TOKEN }}
